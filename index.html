<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeyVault - 安全API管理与加密金库</title>
    <meta name="description" content="安全加密存储API密钥与中转站点配置，支持自定义标签、分组管理、模型拉取、搜索筛选及数据备份导入导出。" />
    <meta property="og:title" content="KeyVault - 安全API管理与加密金库" />
    <meta property="og:description" content="安全加密存储API密钥与中转站点配置，支持自定义标签、分组管理、模型拉取、搜索筛选及数据备份导入导出。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('keyvault_theme_mode_v1');
          // 初始默认模式为日间模式 (仅当用户显式切换为 dark 时才应用夜间模式)
          if (mode === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 antialiased selection:bg-neutral-800 selection:text-white dark:selection:bg-neutral-200 dark:selection:text-neutral-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
